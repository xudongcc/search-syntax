name: Check Pull Request

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.0.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Typecheck source and tests
        run: pnpm exec tsc --noEmit

      - name: Lint
        if: matrix.node == '24'
        run: pnpm lint

      - name: Test package entry points
        run: pnpm test:package

      - name: Coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@v1
